name: flowwm-lab-1

topology:
  nodes:
    # ---------------------------------------------------------
    # Routers
    # ---------------------------------------------------------
    edge-router:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - ./configs/edge-router/daemons:/etc/frr/daemons
        - ./configs/edge-router/frr.conf:/etc/frr/frr.conf
      exec:
        - ip addr add 10.10.99.1/24 dev eth1
        - ip addr add 10.0.0.1/30 dev eth2

    core-router:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - ./configs/core-router/daemons:/etc/frr/daemons
        - ./configs/core-router/frr.conf:/etc/frr/frr.conf
      exec:
        - ip addr add 10.0.0.2/30 dev eth1
        # Create VLAN subinterfaces directly on the trunk port to core-switch
        - ip link add link eth2 name eth2.10 type vlan id 10
        - ip link add link eth2 name eth2.20 type vlan id 20
        - ip link add link eth2 name eth2.30 type vlan id 30
        - ip link add link eth2 name eth2.40 type vlan id 40
        - ip link add link eth2 name eth2.50 type vlan id 50
        - ip addr add 10.10.10.1/24 dev eth2.10
        - ip addr add 10.10.20.1/24 dev eth2.20
        - ip addr add 10.10.30.1/24 dev eth2.30
        - ip addr add 10.10.40.1/24 dev eth2.40
        - ip addr add 10.10.50.1/24 dev eth2.50
        - ip link set eth2 up
        - ip link set eth2.10 up
        - ip link set eth2.20 up
        - ip link set eth2.30 up
        - ip link set eth2.40 up
        - ip link set eth2.50 up

    # ---------------------------------------------------------
    # Switches
    # ---------------------------------------------------------
    core-switch:
      kind: linux
      image: flowwm/lab-switch:latest
      env:
        SNMPV3_USER: ${SNMPV3_USER:-labmonitor}
        SNMPV3_AUTH_PASS: ${SNMPV3_AUTH_PASS:?Set SNMPV3_AUTH_PASS}
        SNMPV3_PRIV_PASS: ${SNMPV3_PRIV_PASS:?Set SNMPV3_PRIV_PASS}
      exec:
        - ip link add name br0 type bridge vlan_filtering 1
        - ip link set dev br0 up
        - ip link set dev eth1 master br0
        - bridge vlan add dev eth1 vid 10-50
        - ip link set dev eth2 master br0
        - bridge vlan add dev eth2 vid 10-50
        - ip link set dev eth3 master br0
        - bridge vlan add dev eth3 vid 10-50
        
        # Mirror port logic: Enslave eth4 to the bridge but restrict its VLANs, OR mirror to it directly.
        # User requested mirroring at switch/bridge layer. We mirror traffic traversing br0 to eth4.
        - ip link set dev eth4 up
        - "tc qdisc add dev br0 handle ffff: ingress"
        - "tc filter add dev br0 parent ffff: matchall action mirred egress mirror dev eth4"
        - "tc qdisc add dev br0 root handle 1: prio"
        - "tc filter add dev br0 parent 1: matchall action mirred egress mirror dev eth4"
        
        - ip link set eth1 up
        - ip link set eth2 up
        - ip link set eth3 up
        
        # Management address and supervised SNMPv3 telemetry
        - ip addr add 10.10.40.2/24 dev br0
        - sh /usr/local/bin/snmp_startup.sh >/var/log/snmpd-supervisor.log 2>&1 &

    access-switch-a:
      kind: linux
      image: flowwm/lab-switch:latest
      exec:
        - ip link add name br0 type bridge vlan_filtering 1
        - ip link set dev br0 up
        - ip link set dev eth1 master br0
        - bridge vlan add dev eth1 vid 10-50
        - ip link set dev eth2 master br0
        - bridge vlan add dev eth2 vid 10 pvid untagged
        - ip link set dev eth3 master br0
        - bridge vlan add dev eth3 vid 10 pvid untagged
        - ip link set dev eth4 master br0
        - bridge vlan add dev eth4 vid 40 pvid untagged
        - ip link set dev eth5 master br0
        - bridge vlan add dev eth5 vid 50 pvid untagged
        
        - ip link set eth1 up
        - ip link set eth2 up
        - ip link set eth3 up
        - ip link set eth4 up
        - ip link set eth5 up

    access-switch-b:
      kind: linux
      image: flowwm/lab-switch:latest
      exec:
        - ip link add name br0 type bridge vlan_filtering 1
        - ip link set dev br0 up
        - ip link set dev eth1 master br0
        - bridge vlan add dev eth1 vid 10-50
        - ip link set dev eth2 master br0
        - bridge vlan add dev eth2 vid 20 pvid untagged
        - ip link set dev eth3 master br0
        - bridge vlan add dev eth3 vid 30 pvid untagged
        
        - ip link set eth1 up
        - ip link set eth2 up
        - ip link set eth3 up

    # ---------------------------------------------------------
    # Endpoints
    # ---------------------------------------------------------
    user-linux-1:
      kind: linux
      image: flowwm/lab-endpoint:latest
      exec:
        - ip addr add 10.10.10.11/24 dev eth1
        - sh -c "ip route del default || true; ip route replace default via 10.10.10.1 dev eth1"
    user-linux-2:
      kind: linux
      image: flowwm/lab-endpoint:latest
      exec:
        - ip addr add 10.10.10.12/24 dev eth1
        - sh -c "ip route del default || true; ip route replace default via 10.10.10.1 dev eth1"
    app-server:
      kind: linux
      image: nginx:latest
      exec:
        - apt-get update
        - apt-get install -y iproute2 iputils-ping
        - ip addr add 10.10.20.11/24 dev eth1
        - sh -c "ip route del default || true; ip route replace default via 10.10.20.1 dev eth1"
    database-server:
      kind: linux
      image: flowwm/lab-database:latest
      env:
        POSTGRES_PASSWORD: "lab-password"
      exec:
        - ip addr add 10.10.30.11/24 dev eth1
        - sh -c "ip route del default || true; ip route replace default via 10.10.30.1 dev eth1"
    dns-dhcp-server:
      kind: linux
      image: flowwm/lab-endpoint:latest
      exec:
        - ip addr add 10.10.40.11/24 dev eth1
        - sh -c "ip route del default || true; ip route replace default via 10.10.40.1 dev eth1"
    honeypot:
      kind: linux
      image: flowwm/lab-honeypot:latest
      exec:
        - /bin/busybox ifconfig eth1 10.10.50.11 netmask 255.255.255.0 up
        - /bin/busybox route add default gw 10.10.50.1
    attacker:
      kind: linux
      image: flowwm/lab-attacker:latest
      exec:
        - ip addr add 10.10.99.11/24 dev eth1
        - sh -c "ip route del default || true; ip route replace default via 10.10.99.1 dev eth1"
    
    # ---------------------------------------------------------
    # Sensor Node
    # ---------------------------------------------------------
    sensor:
      kind: linux
      image: flowwm/lab-sensor:latest
      cmd: "/usr/local/bin/zeek_startup.sh"
      binds:
        - ./telemetry-capture:/usr/local/zeek/logs
        - ./configs/sensor/zeek_startup.sh:/usr/local/bin/zeek_startup.sh
      exec:
        - ifconfig eth1 0.0.0.0
        - ifconfig eth1 promisc

  links:
    - endpoints: ["attacker:eth1", "edge-router:eth1"]
    - endpoints: ["edge-router:eth2", "core-router:eth1"]
    - endpoints: ["core-router:eth2", "core-switch:eth1"]
    - endpoints: ["core-switch:eth2", "access-switch-a:eth1"]
    - endpoints: ["core-switch:eth3", "access-switch-b:eth1"]
    # Dedicated mirror destination, completely out of band from routing
    - endpoints: ["core-switch:eth4", "sensor:eth1"]
    
    - endpoints: ["access-switch-a:eth2", "user-linux-1:eth1"]
    - endpoints: ["access-switch-a:eth3", "user-linux-2:eth1"]
    - endpoints: ["access-switch-a:eth4", "dns-dhcp-server:eth1"]
    - endpoints: ["access-switch-a:eth5", "honeypot:eth1"]
    
    - endpoints: ["access-switch-b:eth2", "app-server:eth1"]
    - endpoints: ["access-switch-b:eth3", "database-server:eth1"]
